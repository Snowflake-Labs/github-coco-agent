name: CoCo — Scan for bugs
on:
  push:
    branches: [main]
    paths: ["demo/**"]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

# Prevent parallel scans from creating duplicate issues.
# cancel-in-progress: push to demo/ during the Monday schedule window
# would otherwise produce two simultaneous scans with identical findings.
concurrency:
  group: scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write # GitHub OIDC token for Snowflake WIF
  contents: read
  issues: write # create issues + labels + comments

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Snowflake connection (OIDC)
        uses: snowflakedb/snowflake-cli-action@v2
        with:
          use-oidc: true

      - name: Write cortex connections.toml
        run: |
          mkdir -p "${HOME}/.snowflake"
          printf '%s\n' \
            '[default]' \
            "account                    = \"${SNOWFLAKE_ACCOUNT}\"" \
            "user                       = \"${SNOWFLAKE_USER}\"" \
            'authenticator              = "WORKLOAD_IDENTITY"' \
            'workload_identity_provider = "OIDC"' \
            "token                      = \"${SNOWFLAKE_TOKEN}\"" \
            "warehouse                  = \"${SNOWFLAKE_WAREHOUSE}\"" \
            "role                       = \"${SNOWFLAKE_ROLE}\"" \
            > "${HOME}/.snowflake/connections.toml"
          chmod 600 "${HOME}/.snowflake/connections.toml"

      - name: Verify Snowflake OIDC connection
        run: |
          snow connection test -c default \
            || { echo "::error::OIDC connection test failed. Check Snowflake WORKLOAD_IDENTITY trust configuration."; exit 1; }

      - name: Install cortex (beta channel)
        run: |
          curl -LsS https://ai.snowflake.com/static/cc-scripts/install.sh -o /tmp/install.sh
          SKIP_PODMAN=1 NON_INTERACTIVE=1 CORTEX_CHANNEL=beta sh /tmp/install.sh
          rm /tmp/install.sh

      - name: Ensure coco labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "coco:auto-fix" \
            --color "0075CA" --description "CoCo will fix this automatically" 2>/dev/null || true
          gh label create "coco:needs-review" \
            --color "E4E669" --description "Review before CoCo fixes" 2>/dev/null || true
          gh label create "coco-agent" \
            --color "5319E7" --description "CoCo agent issue" 2>/dev/null || true
          gh label create "coco-agent-security" \
            --color "D73A4A" --description "Security vulnerability" 2>/dev/null || true
          gh label create "coco-agent-correctness" \
            --color "0E8A16" --description "Correctness issue" 2>/dev/null || true

      - name: Read fix ceiling
        run: |
          CONFIG_VALUE=$(python3 -c "
          import re, pathlib
          cfg = pathlib.Path('.github/coco-config.yml')
          m = re.search(r'max_auto:\s*(\w+)', cfg.read_text()) if cfg.exists() else None
          print(m.group(1) if m else 'conservative')
          " 2>/dev/null || echo "conservative")
          VARS_VALUE="${{ vars.COCO_MAX_AUTO }}"
          MAX_AUTO="${VARS_VALUE:-$CONFIG_VALUE}"
          SOURCE=$( [ -n "$VARS_VALUE" ] && echo "vars.COCO_MAX_AUTO override" || echo ".github/coco-config.yml" )
          echo "COCO_MAX_AUTO=${MAX_AUTO}" >> $GITHUB_ENV
          echo "::notice::Fix ceiling: ${MAX_AUTO} (source: ${SOURCE})"

      - name: Configure gh auth for cortex sandbox
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "${HOME}/.config/gh"
          printf 'github.com:\n    oauth_token: %s\n    git_protocol: https\n' "$GH_TOKEN" \
            > "${HOME}/.config/gh/hosts.yml"
          chmod 600 "${HOME}/.config/gh/hosts.yml"

      - name: Scan for bugs
        run: |
          cortex exec --file .cortex/prompts/scan.md \
            -c default --bypass --no-history \
            --allowed "Glob" \
            --allowed "Read" \
            --allowed "Bash(gh issue list *)" \
          --allowed "Bash(gh issue create *)" \
            --allowed "Bash(gh label create *)"
        env:
          COCO_MAX_AUTO: ${{ env.COCO_MAX_AUTO }}

      - name: Clean up credentials
        if: always()
        run: rm -f "${HOME}/.snowflake/connections.toml"
