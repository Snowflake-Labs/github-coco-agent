name: CoCo — Scan for bugs
on:
  push:
    branches: [main]
    paths: ["demo/**"]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

# Prevent parallel scans from creating duplicate issues.
# cancel-in-progress: push to demo/ during the Monday schedule window
# would otherwise produce two simultaneous scans with identical findings.
concurrency:
  group: scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write # GitHub OIDC token for Snowflake WIF
  contents: read # checkout
  issues: write # create issues + labels + comments
  pull-requests: read # scan checks for existing PRs

jobs:
  scan:
    runs-on: ubuntu-latest
    outputs:
      auto_fix_found: ${{ steps.auto_fix_issue.outputs.found }}
      auto_fix_number: ${{ steps.auto_fix_issue.outputs.number }}
      auto_fix_title: ${{ steps.auto_fix_issue.outputs.title }}
      auto_fix_body: ${{ steps.auto_fix_issue.outputs.body }}
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Snowflake + Cortex Code
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true
          cortex-code: true
          connection-name: default

      - name: Verify Snowflake OIDC connection
        run: |
          snow connection test -c default \
            || { echo "::error::OIDC connection test failed. Check Snowflake WORKLOAD_IDENTITY trust configuration."; exit 1; }

      - name: Ensure coco labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "coco:auto-fix" \
            --color "0075CA" --description "CoCo will fix this automatically" 2>/dev/null || true
          gh label create "coco:needs-review" \
            --color "E4E669" --description "Review before CoCo fixes" 2>/dev/null || true
          gh label create "coco-agent" \
            --color "5319E7" --description "CoCo agent issue" 2>/dev/null || true
          gh label create "coco-agent-security" \
            --color "D73A4A" --description "Security vulnerability" 2>/dev/null || true
          gh label create "coco-agent-correctness" \
            --color "0E8A16" --description "Correctness issue" 2>/dev/null || true

      - name: Read fix ceiling
        run: |
          CONFIG_VALUE=$(python3 -c "
          import re, pathlib
          cfg = pathlib.Path('.github/coco-config.yml')
          m = re.search(r'max_auto:\s*(\w+)', cfg.read_text()) if cfg.exists() else None
          print(m.group(1) if m else 'conservative')
          " 2>/dev/null || echo "conservative")
          VARS_VALUE="${{ vars.COCO_MAX_AUTO }}"
          MAX_AUTO="${VARS_VALUE:-$CONFIG_VALUE}"
          SOURCE=$( [ -n "$VARS_VALUE" ] && echo "vars.COCO_MAX_AUTO override" || echo ".github/coco-config.yml" )
          echo "COCO_MAX_AUTO=${MAX_AUTO}" >> $GITHUB_ENV
          echo "::notice::Fix ceiling: ${MAX_AUTO} (source: ${SOURCE})"

      - name: Configure gh auth for cortex sandbox
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "${HOME}/.config/gh"
          printf 'github.com:\n    oauth_token: %s\n    git_protocol: https\n' "$GH_TOKEN" \
            > "${HOME}/.config/gh/hosts.yml"
          chmod 600 "${HOME}/.config/gh/hosts.yml"

      - name: Scan for bugs
        run: |
          cortex exec --file .cortex/prompts/scan.md \
            -c default --bypass --no-history \
            --allowed "Glob" \
            --allowed "Read" \
            --allowed "Bash(gh issue list *)" \
          --allowed "Bash(gh issue create *)" \
            --allowed "Bash(gh label create *)"
        env:
          COCO_MAX_AUTO: ${{ env.COCO_MAX_AUTO }}

      - name: Capture auto-fix issue for workflow_call chain
        id: auto_fix_issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          issue_json=$(gh issue list \
            --label "coco:auto-fix" --state open --limit 1 \
            --json number,title,body 2>/dev/null || echo '[]')
          number=$(echo "$issue_json" | python3 -c \
            "import sys,json; r=json.load(sys.stdin); print(r[0]['number'] if r else '')" 2>/dev/null)
          if [ -n "$number" ]; then
            title=$(echo "$issue_json" | python3 -c \
              "import sys,json; r=json.load(sys.stdin); print(r[0]['title'])")
            body=$(echo "$issue_json" | python3 -c \
              "import sys,json; r=json.load(sys.stdin); print(r[0]['body'])")
            echo "found=true"   >> "$GITHUB_OUTPUT"
            echo "number=$number" >> "$GITHUB_OUTPUT"
            echo "title=$title"  >> "$GITHUB_OUTPUT"
            { echo 'body<<BODY_EOF'; echo "$body"; echo 'BODY_EOF'; } >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Clean up credentials
        if: always()
        run: rm -f "${HOME}/.config/gh/hosts.yml"

  # Directly invoke the fix workflow for any coco:auto-fix issue found by the
  # scan. Events created by GITHUB_TOKEN (such as the coco:auto-fix label added
  # by the scan) cannot trigger other workflows, so we chain via workflow_call,
  # which is not subject to that rule.
  #
  # The called workflow still runs with this caller's GITHUB_TOKEN, and its
  # permissions are capped at what is granted to this calling job. The
  # workflow-level block above is read-only for contents/pull-requests, so this
  # job needs its own block matching cortex-fix.yml's top-level permissions.
  auto-fix:
    needs: scan
    if: needs.scan.outputs.auto_fix_found == 'true'
    permissions:
      id-token: write # Snowflake OIDC in cortex-fix
      contents: write # push fix branch
      issues: write # comment on issue
      pull-requests: write # open PR
    uses: ./.github/workflows/cortex-fix.yml
    with:
      issue_number: ${{ fromJson(needs.scan.outputs.auto_fix_number) }}
      issue_title: ${{ needs.scan.outputs.auto_fix_title }}
      issue_body: ${{ needs.scan.outputs.auto_fix_body }}
    secrets: inherit
