name: CoCo — Fix on @coco fix comment
on:
    issue_comment:
        types: [created]

permissions:
    id-token: write
    contents: write
    issues: write
    pull-requests: write

jobs:
    coco-comment-fix:
        # Only triggers on issue comments (not PR review comments) containing @coco fix
        if: |
            !github.event.issue.pull_request &&
            (contains(github.event.comment.body, '@coco fix') ||
             contains(github.event.comment.body, '@coco-agent fix'))
        uses: ./.github/workflows/cortex-fix.yml
        with:
            issue_number: ${{ github.event.issue.number }}
            issue_title: ${{ github.event.issue.title }}
            issue_body: ${{ github.event.issue.body }}
        secrets: inherit
